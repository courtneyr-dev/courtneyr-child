      - generic [ref=e77]:
        - text: ✦
        - paragraph [ref=e78]: ABOUT
        - paragraph [ref=e79]: courtney · the long version
        - paragraph [ref=e80]: Meet Courtney Robertson, a passionate technology teacher who has been teaching basic through advanced software, hardware, and social media uses in plain English since 2001. Courtney’s ability to communicate complex technical information in a way that everyone can understand has made her a sought-after speaker for conferences, online training, and classrooms.
        - separator [ref=e81]
        - heading "✺ In the classroom ✺" [level=2] [ref=e82]
        - paragraph [ref=e83]: With a teaching background that spans from elementary basic computer specials to high school computer technology shop — where she taught programming, networking, and hardware — Courtney has helped countless students develop the skills they need to succeed in the digital age. As a business education teacher, she has also taught web design, accounting, and more.
        - paragraph [ref=e84]: Beyond the classroom, Courtney has served as a Career Development Coordinator, Department Chair, and Future Business Leaders of America advisor, plus WordPress Training Team Faculty Member — demonstrating her commitment to student success both in and out of the classroom. She continues to share her knowledge and expertise with adult learners through Continuing Adult Education programs.
        - separator [ref=e85]
        - heading "✺ Beyond the classroom ✺" [level=2] [ref=e86]
        - paragraph [ref=e87]: Courtney’s talents go beyond technology education — she is also a gifted musician who played the violin and mandolin throughout school. After graduating from high school, Courtney attended Bloomsburg University, where she majored in Business, Computer, and Information Technology Education.
        - generic [ref=e88]:
          - blockquote [ref=e89]:
            - paragraph [ref=e90]: Whether you’re a third-grader or a grandparent, a student or a business owner — the commitment to teaching in plain language and providing accountability is what makes the difference.
            - generic [ref=e91]: — Courtney’s teaching ethos
          - button "Copy quote to clipboard" [ref=e92] [cursor=pointer]:
