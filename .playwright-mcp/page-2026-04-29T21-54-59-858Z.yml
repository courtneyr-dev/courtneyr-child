      - generic [ref=e87]:
        - text: ✺
        - figure [ref=e88]
        - figure [ref=e91]:
          - blockquote [ref=e93]:
            - 'link "This Week in WordPress #347" [ref=e94] [cursor=pointer]':
              - /url: https://wpbuilds.com/2025/09/09/this-week-in-wordpress-347/
        - 'heading "🎙️ Tech Troubles & WordPress Wins — My Take on “This Week in WordPress” #347" [level=2] [ref=e95]'
        - paragraph [ref=e96]: "The episode opened with classic live-show gremlins—glitchy audio, misbehaving embeds, and post-WordCamp brain fog. The chaos set an oddly perfect tone: WordPress work is messy in real life, yet progress continues to happen. The links below point to the original sources Nathan gathered for the show, so you can jump straight to the good stuff."
        - separator [ref=e97]
        - heading "🔒 Security pulse" [level=2] [ref=e98]
        - paragraph [ref=e99]:
          - text: "Security stories landed fast and practical this week. Melapress published its 2025 survey, a crowdsourced snapshot of what WordPress pros actually worry about. An interesting tension emerged: uptime often takes priority over compliance on lists, even as regulations ramp up. Worth a skim if client conversations keep drifting to “just keep the site up.” ("
          - link "Patchstack" [ref=e100] [cursor=pointer]:
            - /url: https://patchstack.com/articles/sql-injection-vulnerability-patched-in-paid-membership-subscriptions-plugin
          - text: )
        - paragraph [ref=e101]:
          - text: Patchstack flagged a critical SQL injection that’s already patched in the
          - strong [ref=e102]: Paid Membership Subscriptions
          - text: plugin. If the plugin resides in a stack, update it before finishing this paragraph.
        - paragraph [ref=e103]:
          - text: For a broad overview, SolidWP’s weekly report compiles plugin and theme vulnerabilities, providing the usual “is this in my stack?” triage value. (
          - link "WP Builds" [ref=e104] [cursor=pointer]:
            - /url: https://wpbuilds.com/2025/09/09/this-week-in-wordpress-347/?share=facebook
          - text: )
        - paragraph [ref=e105]:
          - text: ✦ Beyond WordPress, Cloudflare detailed how an attacker used a Salesloft/Drift → Salesforce integration path to access data. The write-up serves as a sober reminder that vendor chains can create a significant blast radius. Audit who gets access to what, not just what runs on a server. (
          - link "The Delta" [ref=e106] [cursor=pointer]:
            - /url: https://www.delta.blog/wp-engine-thoughts-on-the-motion-to-dismiss-hearing
          - text: )
        - separator [ref=e107]
        - heading "🧰 Tools & tinkering" [level=2] [ref=e108]
        - paragraph [ref=e109]:
          - text: Alex Kirk shipped a handy update to the
          - strong [ref=e110]: Playground Step Library
          - text: ": it’s now consumable as an npm package"
          - emphasis [ref=e111]: and
          - text: has a friendlier UI for crafting blueprints. Spinning up shareable, pre-configured WordPress sandboxes just got easier for demos, training, and support. (
          - link "Alex Kirk" [ref=e112] [cursor=pointer]:
            - /url: https://alex.kirk.at/2025/09/05/npm-install-playground-step-library
          - text: )
        - paragraph [ref=e113]:
          - text: "Publishing pipeline pro-tip: the official"
          - strong [ref=e114]: Google Docs → WordPress.com/Jetpack
          - text: add-on still exists, quietly saving teams who draft in Docs and publish on WordPress. If collaboration happens in Docs today, this is “less yak-shaving, more shipping.” (
          - link "WP Builds" [ref=e115] [cursor=pointer]:
            - /url: https://wpbuilds.com/2025/09/09/this-week-in-wordpress-347/
          - text: )
        - paragraph [ref=e116]: "Two bite-size block/dev nuggets:"
        - list [ref=e117]:
          - listitem [ref=e118]:
            - text: ✦
            - strong [ref=e119]: block.json
            - text: primer for plugin authors who want cleaner block registration and better runtime behavior. Tight, technical, functional. (
            - link "WP Builds" [ref=e120] [cursor=pointer]:
              - /url: https://wpbuilds.com/2025/09/09/this-week-in-wordpress-347/
            - text: )
          - listitem [ref=e121]:
            - text: ✦
            - strong [ref=e122]: BlaBlaBlocks Tabs
            - text: adds accessible tabs to the editor with templates. Suitable for content teams that insist on “less scroll, more structure.” (
            - link "WP Builds" [ref=e123] [cursor=pointer]:
              - /url: https://wpbuilds.com/2025/09/09/this-week-in-wordpress-347/
            - text: )
        - paragraph [ref=e124]: "And a pair of utility updates:"
        - list [ref=e125]:
          - listitem [ref=e126]:
            - text: ✦
            - strong [ref=e127]: WooCommerce 10.2 pre-release
            - text: is ready for testing (product collection carousel, faster Cart block, better onboarding). Staging sites love this kind of week. (
            - link "WP Builds" [ref=e128] [cursor=pointer]:
              - /url: https://wpbuilds.com/2025/09/09/this-week-in-wordpress-347/
            - text: )
          - listitem [ref=e129]:
            - text: ✦
            - strong [ref=e130]: DB Reset Pro
            - text: offers one-click database resets while preserving uploads—useful for demo sites, but strictly for folks who respect backups. (
            - link "WP Builds" [ref=e131] [cursor=pointer]:
              - /url: https://wpbuilds.com/2025/09/09/this-week-in-wordpress-347/
            - text: )
        - separator [ref=e132]
        - heading "🌐 AI & the wider web" [level=2] [ref=e133]
        - paragraph [ref=e134]:
          - text: For context-seekers, the
          - strong [ref=e135]: Financial Times
          - text: explainer on transformers remains a crisp on-ramp for understanding why modern AI feels different. Pair that with Simon Willison’s running list of “vibe-coded” AI-assisted tools if experimental dev workflows spark joy. (
          - link "WP Builds" [ref=e136] [cursor=pointer]:
            - /url: https://wpbuilds.com/2025/09/09/this-week-in-wordpress-347/
          - text: )
        - paragraph [ref=e137]:
          - text: Publishers vs. crawlers continues to simmer. This op-ed walks through Cloudflare’s proposal to change the economics of AI scraping—food for thought for anyone whose content now fuels chat answers more than search clicks. (
          - link "WP Builds" [ref=e138] [cursor=pointer]:
            - /url: https://wpbuilds.com/2025/09/09/this-week-in-wordpress-347/
          - text: ) ✺
        - separator [ref=e139]
        - heading "🧑‍🦯 Accessibility & community" [level=2] [ref=e140]
        - paragraph [ref=e141]:
          - text: Joe Dolson shipped
          - strong [ref=e142]: WP Accessibility 2.2.0
          - text: with notable changes, and the
          - strong [ref=e143]: WP Accessibility Docs
          - text: project posted an August update—a good pulse check for teams improving baseline a11y instead of bolting it on at the end. (
          - link "WP Builds" [ref=e144] [cursor=pointer]:
            - /url: https://wpbuilds.com/2025/09/09/this-week-in-wordpress-347/
          - text: )
        - paragraph [ref=e145]:
          - text: The Accessibility Team also introduced new team representatives, with clear expectations about their roles. Community health beats shiny features in the long term; leadership clarity helps contributors pick a lane. (
          - link "Make WordPress" [ref=e146] [cursor=pointer]:
            - /url: https://make.wordpress.org/accessibility/2025/08/28/introducing-accessibility-team-reps-for-2025-2026
          - text: )
        - separator [ref=e147]
        - heading "🌍 Multilingual & content ops" [level=2] [ref=e148]
        - paragraph [ref=e149]:
          - strong [ref=e150]: WPML 4.8
          - text: leans into AI translation with a “better than human” claim and a credit-based model. Whether that line lands or not, translation quality continues to improve, and teams with big content catalogs finally have options beyond “someday.” (
          - link "WP Builds" [ref=e151] [cursor=pointer]:
            - /url: https://wpbuilds.com/2025/09/09/this-week-in-wordpress-347/
          - text: )
        - separator [ref=e152]
        - heading "🗓️ Events & extras" [level=2] [ref=e153]
        - paragraph [ref=e154]:
          - strong [ref=e155]: LoopConf (London, Sept 25)
          - text: brings a focused, dev-heavy lineup. If a trip is on the calendar,
          - strong [ref=e156]: WPLDN
          - text: (the evening before) is an easy add-on for hallway-track energy. (
          - link "WP Builds" [ref=e157] [cursor=pointer]:
            - /url: https://wpbuilds.com/2025/09/09/this-week-in-wordpress-347/
          - text: )
        - paragraph [ref=e158]: "Two bonus links from the “not WordPress, still delightful” shelf:"
        - list [ref=e159]:
          - listitem [ref=e160]:
            - text: ✦
            - strong [ref=e161]: Web Day Out
            - text: "(Brighton, Mar 12, 2026): a one-day love letter to what browsers can do"
            - emphasis [ref=e162]: today
            - text: . Front-end folks, this scratches the right itch. (
            - link "WP Builds" [ref=e163] [cursor=pointer]:
              - /url: https://wpbuilds.com/2025/09/09/this-week-in-wordpress-347/
            - text: )
          - listitem [ref=e164]:
            - text: ✦
            - strong [ref=e165]: Mitch Ivin’s Windows XP portfolio
            - text: ": pixel-perfect nostalgia as a portfolio site. Pure craft, pure fun. ("
            - link "WP Builds" [ref=e166] [cursor=pointer]:
              - /url: https://wpbuilds.com/2025/09/09/this-week-in-wordpress-347/
            - text: )
        - text: ✦
