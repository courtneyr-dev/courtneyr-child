<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 224" width="200" height="224"><!-- Decorative pair of dice for the play archive's still life (PKIW #232). Palette only, tilts from the rotation tokens (-2.5deg, 2.8deg); a CSS background, never content. The lower die's foot is at the bottom edge so it stands on the band. -->
