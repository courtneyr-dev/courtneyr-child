<rect x="28" y="120" width="100" height="100" rx="14" fill="#241c4a"/>
<rect x="20" y="112" width="100" height="100" rx="14" fill="#fbfaf5"/>
<g fill="#241c4a" stroke="none"><circle cx="44" cy="136" r="9"/><circle cx="96" cy="136" r="9"/><circle cx="70" cy="162" r="9"/><circle cx="44" cy="188" r="9"/><circle cx="96" cy="188" r="9"/></g>
</g>
<g transform="rotate(2.8 125 64)" stroke="#241c4a" stroke-width="4" stroke-linejoin="round">
<rect x="86" y="27" width="86" height="86" rx="12" fill="#241c4a"/>
<rect x="80" y="21" width="86" height="86" rx="12" fill="#8ecae6"/>
