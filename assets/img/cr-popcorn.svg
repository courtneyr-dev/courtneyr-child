<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 270" width="230" height="270"><!-- Decorative cut-paper popcorn bucket for the watch archive's top shelf (PKIW #227). Palette only; a CSS background, never content. The bucket's foot is at y=270. -->
