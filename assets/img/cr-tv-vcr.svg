<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 344" width="372" height="344"><!-- Decorative CRT television on a VCR for the watch archive's top shelf (PKIW #227). Palette only, hard outlines and offset shadows, cut-paper edges; painted as a CSS background, never content. The VCR's foot is at y=344 so it stands on the plank. -->
<!-- cabinet shadow and depth -->
<path d="M32 22 L326 18 L336 236 L30 240 Z" fill="#023047"/>
<path d="M312 14 L336 24 L336 236 L312 230 Z" fill="#023047"/>
<!-- cabinet -->
<path d="M22 14 Q20 10 26 9 L306 6 Q314 6 314 14 L312 228 Q312 234 306 234 L28 236 Q22 236 22 230 Z" fill="#241c4a" stroke="#bcb5e3" stroke-width="3" stroke-linejoin="round"/>
<!-- bezel -->
<path d="M40 30 Q38 26 44 26 L240 24 Q248 24 248 32 L246 200 Q246 206 240 206 L44 208 Q38 208 38 202 Z" fill="#023047"/>
<!-- glass with colour bars -->
<clipPath id="g"><rect x="52" y="40" width="182" height="152" rx="18"/></clipPath>
<g clip-path="url(#g)"><rect x="52" y="40" width="31" height="152" fill="#bcb5e3"/><rect x="83" y="40" width="30" height="152" fill="#8ecae6"/><rect x="113" y="40" width="30" height="152" fill="#647baf"/><rect x="143" y="40" width="30" height="152" fill="#219ebc"/><rect x="173" y="40" width="31" height="152" fill="#ffb703"/><rect x="204" y="40" width="30" height="152" fill="#bcb5e3"/>
<!-- scanlines -->
<g stroke="#241c4a" stroke-opacity="0.16" stroke-width="2"><path d="M52 48h182M52 56h182M52 64h182M52 72h182M52 80h182M52 88h182M52 96h182M52 104h182M52 112h182M52 120h182M52 128h182M52 136h182M52 144h182M52 152h182M52 160h182M52 168h182M52 176h182M52 184h182"/></g>
<!-- reflection -->
<path d="M62 50 L98 46 L74 92 L58 96 Z" fill="#fbfaf5" fill-opacity="0.55"/></g>
<rect x="52" y="40" width="182" height="152" rx="18" fill="none" stroke="#241c4a" stroke-width="6"/>
<rect x="56" y="44" width="174" height="144" rx="15" fill="none" stroke="#8ecae6" stroke-opacity="0.6" stroke-width="2"/>
<!-- knobs -->
<g stroke="#bcb5e3" stroke-width="3"><circle cx="280" cy="62" r="16" fill="#647baf"/><circle cx="280" cy="112" r="16" fill="#647baf"/></g>
<g stroke="#241c4a" stroke-width="4" stroke-linecap="round"><path d="M280 50v12"/><path d="M270 104l10 8"/></g>
<!-- speaker grille -->
<g fill="#126782"><rect x="262" y="146" width="38" height="6" rx="3"/><rect x="262" y="158" width="38" height="6" rx="3"/><rect x="262" y="170" width="38" height="6" rx="3"/><rect x="262" y="182" width="38" height="6" rx="3"/><rect x="262" y="194" width="38" height="6" rx="3"/></g>
<!-- feet -->
<rect x="44" y="234" width="28" height="10" fill="#023047"/><rect x="262" y="234" width="28" height="10" fill="#023047"/>
<!-- VCR shadow -->
<path d="M50 254 L342 250 L344 338 L50 340 Z" fill="#023047"/>
<!-- VCR body -->
<path d="M40 246 Q38 242 44 242 L328 240 Q334 240 334 246 L332 326 Q332 332 326 332 L46 334 Q40 334 40 328 Z" fill="#241c4a" stroke="#bcb5e3" stroke-width="3" stroke-linejoin="round"/>
<path d="M44 248 L328 246" stroke="#647baf" stroke-width="2"/>
<!-- cassette slot -->
<rect x="60" y="262" width="138" height="18" rx="3" fill="#023047" stroke="#647baf" stroke-width="2"/><rect x="68" y="269" width="122" height="4" fill="#241c4a"/>
<!-- transport buttons -->
<g fill="#647baf"><rect x="60" y="298" width="22" height="12" rx="2"/><rect x="88" y="298" width="22" height="12" rx="2"/><rect x="116" y="298" width="22" height="12" rx="2" fill="#ffb703"/><rect x="144" y="298" width="22" height="12" rx="2"/><rect x="172" y="298" width="22" height="12" rx="2"/></g>
<!-- counter -->
<rect x="226" y="262" width="76" height="22" rx="3" fill="#023047"/><g fill="#fb8500"><rect x="236" y="268" width="6" height="10"/><rect x="246" y="268" width="6" height="10"/><rect x="260" y="268" width="6" height="10"/><rect x="270" y="268" width="6" height="10"/><rect x="284" y="268" width="6" height="10"/></g>
<!-- power light -->
<circle cx="312" cy="306" r="6" fill="#fb8500" stroke="#241c4a" stroke-width="2"/>
<!-- VCR feet, the contact with the plank -->
<rect x="54" y="332" width="30" height="12" fill="#023047"/><rect x="290" y="330" width="30" height="14" fill="#023047"/>
</svg>
