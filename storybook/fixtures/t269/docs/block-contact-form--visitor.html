<style id="courtneyr-evidence-labels-inline-css">
/*
 * Merge Conflicts evidence labels.
 *
 * Native blocks: alignwide Group.cr-evidence > Group.cr-evidence__row
 * > Paragraph.cr-evidence-label + Group.cr-evidence__body.
 * The editor's inner-block layout receives the same grid.
 *
 * SVG backgrounds are embedded from assets/evidence-labels/*.svg so this
 * sheet remains portable when WordPress or used-CSS tooling inlines it.
 * Label words, destinations, and definitions remain live HTML.
 */

/* Give native and Post Kinds evidence content room without changing other posts. */
.wp-block-post-content:has(.cr-evidence),
.wp-block-post-content:has(.cr-evidence) > .pkiw-singular-entry {
	inline-size: 100%;
	max-inline-size: var(--wp--style--global--wide-size, 1100px);
}

/* The semantic wrapper is not a native constrained layout; keep its prose measure. */
.wp-block-post-content:has(.cr-evidence) > .pkiw-singular-entry > .e-content > :not(.alignwide):not(.alignfull):not(.alignleft):not(.alignright) {
	max-inline-size: var(--wp--style--global--content-size, 720px);
	margin-inline: auto;
}

/* Outrank the legacy .alignwide width without depending on stylesheet order. */
.wp-block-group.cr-evidence {
	container-name: cr-evidence;
	container-type: inline-size;
	inline-size: 100%;
	max-inline-size: var(--wp--style--global--wide-size, 1100px);
}

.cr-evidence > .block-editor-inner-blocks,
.cr-evidence > .block-editor-block-list__layout,
.cr-evidence > .block-editor-inner-blocks > .block-editor-block-list__layout,
.cr-evidence .cr-evidence__row > .block-editor-inner-blocks,
.cr-evidence .cr-evidence__row > .block-editor-block-list__layout {
	grid-column: 1 / -1;
	inline-size: 100%;
	min-inline-size: 0;
	max-inline-size: none;
	margin-inline: 0 !important;
}

.cr-evidence .cr-evidence__row,
.cr-evidence .cr-evidence__row > .block-editor-block-list__layout,
.cr-evidence .cr-evidence__row > .block-editor-inner-blocks > .block-editor-block-list__layout {
	display: grid;
	grid-template-columns: minmax(0, 1fr);
	column-gap: var(--cr-space-xs);
	row-gap: var(--cr-space-xs);
	align-items: start;
	inline-size: 100%;
	min-inline-size: 0;
}

.cr-evidence .cr-evidence__row {
	max-inline-size: var(--wp--style--global--content-size, 720px);
	margin-block: 0;

	/* WordPress constrained layouts give child inline margins !important. */
	margin-inline: auto !important;
}

.cr-evidence .cr-evidence__row + .cr-evidence__row {
	margin-block-start: var(--cr-space-lg);
}


/* These selectors also cancel the old tape/float treatment, only in new rows. */
.cr-evidence .cr-evidence__row .cr-evidence-label {
	--cr-evidence-ink: var(--wp--preset--color--primary, var(--cr-russian-violet));
	--cr-evidence-underline: var(--cr-evidence-ink);
	--cr-evidence-left: 30.7292%;
	--cr-evidence-right: 12.5%;
	--cr-evidence-top: 34.0278%;
	--cr-evidence-bottom: 34.0278%;

	position: relative;
	display: grid;
	grid-template-columns: var(--cr-evidence-left) minmax(0, 1fr) var(--cr-evidence-right);
	grid-template-rows: var(--cr-evidence-top) minmax(1.75em, 1fr) var(--cr-evidence-bottom);
	align-self: start;
	justify-self: start;
	inline-size: min(100%, 14em);
	min-inline-size: 0;
	max-inline-size: 100%;
	aspect-ratio: 8 / 3;
	box-sizing: border-box;
	margin: 0 !important;
	padding: 0;
	border: 0;
	background-color: transparent;
	background-image: var(--cr-evidence-art);
	background-repeat: no-repeat;
	background-position: center;
	background-size: 100% 100%;
	box-shadow: none;
	float: none;
	clear: none;
	transform: none;
	color: var(--cr-evidence-ink);
	font-family: var(--cr-font-accent);
	font-size: max(var(--cr-text-sm), 14px);
	font-style: normal;
	font-weight: var(--cr-weight-bold);
	line-height: var(--cr-leading-tight);
	letter-spacing: var(--cr-tracking-normal);
	text-align: center;
	text-transform: none;
	white-space: normal;
	overflow: visible;
}

.cr-evidence .cr-evidence-label > a:any-link {
	grid-column: 2;
	grid-row: 2;
	display: flex;
	align-items: center;
	justify-content: center;
	min-inline-size: 0;
	min-block-size: 1.75em;
	max-inline-size: 100%;
	margin: 0;
	padding: 0;
	border: 0;
	background: none;
	color: var(--cr-evidence-ink);
	font: inherit;
	letter-spacing: inherit;
	text-align: center;
	text-transform: none;
	text-decoration-line: underline;
	text-decoration-color: var(--cr-evidence-underline);
	text-decoration-thickness: 0.08em;
	text-underline-offset: 0.16em;
	overflow-wrap: anywhere;
}

.cr-evidence .cr-evidence-label > a:any-link:hover {
	color: var(--cr-evidence-ink);
	background: none;
	text-decoration-thickness: 0.14em;
}

.cr-evidence .cr-evidence-label > a:any-link:focus-visible {
	outline: 3px solid var(--cr-focus-ring);
	outline-offset: 2px;
	border-radius: var(--cr-radius-xs);
	box-shadow: 0 0 0 5px var(--wp--preset--color--primary, var(--cr-russian-violet));
}

.cr-evidence .cr-evidence__row .cr-evidence__body {
	grid-column: 1;
	inline-size: 100%;
	min-inline-size: 0;
	max-inline-size: none;
	margin: 0 !important;
	clear: none;
}

.cr-evidence .cr-evidence__body > :first-child,
.cr-evidence .cr-evidence__body > .block-editor-inner-blocks > .block-editor-block-list__layout > :first-child {
	margin-block-start: 0;
}

.cr-evidence .cr-evidence__body > :last-child,
.cr-evidence .cr-evidence__body > .block-editor-inner-blocks > .block-editor-block-list__layout > :last-child {
	margin-block-end: 0;
}

/*
 * 1096px at the default root size: 720px prose, two 180px gutters,
 * and two 8px gaps. A rem query also returns enlarged text to normal
 * stacked flow. The actual container, not the viewport, selects this.
 */
@container cr-evidence (min-width: 68.5rem) {

	.cr-evidence .cr-evidence__row,
	.cr-evidence .cr-evidence__row > .block-editor-block-list__layout,
	.cr-evidence .cr-evidence__row > .block-editor-inner-blocks > .block-editor-block-list__layout {
		grid-template-columns: minmax(0, 1fr) var(--wp--style--global--content-size, 720px) minmax(0, 1fr);
		max-inline-size: none;
	}

	.cr-evidence .cr-evidence__row .cr-evidence-label {
		grid-column: 1;
	}

	.cr-evidence .cr-evidence__row .cr-evidence__body {
		grid-column: 2;
	}
}

		background: none;
		color: CanvasText;
	}

	.cr-evidence .cr-evidence-label > a:any-link {
		display: inline;
		min-block-size: 0;
		color: LinkText;
		text-decoration-color: currentcolor;
	}

		box-shadow: none;
	}

@media print {

	.wp-block-group.cr-evidence {
		container-type: normal;
		max-inline-size: none;
	}

	.cr-evidence .cr-evidence__row,
	.cr-evidence .cr-evidence__row > .block-editor-block-list__layout,
	.cr-evidence .cr-evidence__row > .block-editor-inner-blocks > .block-editor-block-list__layout {
		display: block;
		max-inline-size: none;
	}

	.cr-evidence .cr-evidence__row .cr-evidence-label {
		display: block;
		inline-size: fit-content;
		max-inline-size: 100%;
		aspect-ratio: auto;
		margin-block-end: var(--cr-space-xs) !important;

		background: none;

	}

	.cr-evidence .cr-evidence-label > a:any-link {

		min-block-size: 0;
		color: var(--wp--preset--color--primary, var(--cr-russian-violet));

	}
}

body.single-format-aside main.single-post   { background-color: var(--cr-type-aside-bg); }
		body.single-format-audio main.single-post   { background-color: var(--cr-type-audio-bg); }
		body.single-format-chat main.single-post    { background-color: var(--cr-type-chat-bg); }
		body.single-format-gallery main.single-post { background-color: var(--cr-type-gallery-bg); }
		body.single-format-image main.single-post   { background-color: var(--cr-type-image-bg); }
		body.single-format-link main.single-post    { background-color: var(--cr-type-link-bg); }
		body.single-format-quote main.single-post   { background-color: var(--cr-type-quote-bg); }
		body.single-format-status main.single-post  { background-color: var(--cr-type-status-bg); }

		/* 0.7.149: single posts use the theme.json content and wide sizes
		   (720px / 1100px), the same as pages. The body.single 80vw stage
		   from v0.5.77-v0.5.89 is gone at the request of Courtney (2026-11-02):
		   post and page widths stay uniform. Post prose sits inside the
		   .e-content wrapper, so the 65ch reading measure would stop it
		   short of the column; the measure follows the content size here. */
		body.single {
			--cr-measure: var(--wp--style--global--content-size);
		}
		/* v0.5.81: hide the thin separator HRs on the homepage that
		   create faint horizontal lines (image #182, #185, #191). The
		   <hr is-style-separator-thin> elements are baked into a DB
		   template customization (wp_template post 37371). CSS-hide is
		   the non-destructive fix — when the DB customization is later
		   removed, this rule is harmless because the file template
		   has no separators. */
		body.home hr.wp-block-separator.is-style-separator-thin {
			display: none !important;
		}
		/* v0.5.82 — restore index-card sizing for groups containing
		   multiple .is-style-cr-card.is-nowrap siblings (the audience
		   cards on the homepage and similar patterns). v0.5.81 site-wide
		   width override ballooned each card to fill 80vw, stacking
		   them as horizontal bars (image #193). Put the parent in
		   flex-row+wrap and cap each card at ~25% of a 1100px container,
		   so 4 fit per row at index-card proportions. Below 1024px the
		   cards stack naturally. */
		@media (min-width: 1024px) {
			.wp-block-group:has(> .is-style-cr-card.is-nowrap) {
				display: flex !important;
				flex-direction: row !important;
				flex-wrap: wrap !important;
				gap: var(--wp--preset--spacing--medium, 1rem);
				justify-content: center;
				max-width: 1100px !important;
				margin-inline: auto !important;
			}
			.wp-block-group:has(> .is-style-cr-card.is-nowrap) > .is-style-cr-card {
				flex: 0 1 calc(25% - 0.75rem);
				max-width: 17rem;
				min-width: 14rem;
				margin: 0 !important;
			}
		}
		/* v0.5.86 — v0.5.84 prose cap rule reverted. The clamp(45ch, 90ch)
		   cap on .wp-block-post-content > * cascaded into Query Loop
		   archives (image #197 — empty boxes per post) and centered
		   prose narrowly within the 80vw wrapper, leaving dead space
		   on About and other pages (image #196). User feedback (image
		   #198): "I actually loved the width of things on home" —
		   restore the wider prose stage; revisit WCAG 1.4.8 line-length
		   compliance later via theme.json contentSize per template part
		   instead of bolt-on override CSS. */

		/* v0.5.88 — v0.5.87 layout/spacing refinements reverted per user
		   request (image #201): "make the homepage look like this again"
		   — image #201 matches image #198 (the loved state). Reverted:
		   hero column gap reduction, audience-cards 2x2 grid, Field
		   Notes row centering, closer body margin-bottom override.
		   KEPT (per "keep the larger font though"): the medium-size
		   font bumps on the four homepage prose paragraphs that read
		   too small at the v0.5.86 site-wide width. */

		/* Hero: bump "Join my newsletter…" intro paragraph. */
		.cr-home-hero .has-border-dark-color {
			font-size: var(--wp--preset--font-size--medium, 1.25rem);
			line-height: 1.5;
		}

		/* Newsletter Features left column: bump "Every Saturday…" intro
		   paragraph + "Looking for personalized guidance?" text-box copy. */
		.cr-home-features .wp-block-column:first-child p {
			font-size: var(--wp--preset--font-size--medium, 1.25rem);
			line-height: 1.55;
		}

		/* Closer ("Start your journey today" CTA): bump "Every Saturday…"
		   body paragraph. */
		.cr-home-closer p.has-secondary-color,
		.cr-home-closer .wp-block-column:first-child > p {
			font-size: var(--wp--preset--font-size--medium, 1.25rem);
			line-height: 1.55;
		}
